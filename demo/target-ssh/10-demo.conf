# Only certificates signed by the Vault SSH CA are accepted. With no
# AuthorizedPrincipalsFile, the certificate principal must equal the login user.
TrustedUserCAKeys /shared/ssh_user_ca.pub
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
HostKey /etc/ssh/ssh_host_ed25519_key
