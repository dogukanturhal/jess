name: Release

# Runs on version tags (v0.2.0, v0.2.0-rc.1). Builds the archives with
# GoReleaser, signs the checksum file with cosign (keyless), attaches SPDX
# SBOMs from syft, and records a build provenance attestation for the
# checksummed artifacts.
#
# The container image is not published from here yet: the Dockerfile at the
# repository root builds it (`docker build -t jess .`).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    name: archives, checksums, SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # jess-web embeds the console (go:embed web/dist), so build it first.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: cmd/jess-web/web/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cmd/jess-web/web/pnpm-lock.yaml

      - name: Build the web console
        working-directory: cmd/jess-web/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
